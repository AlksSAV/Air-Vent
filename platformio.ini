[env:uno]
platform = atmelavr
board = uno
framework = arduino

lib_deps =
	arduino-libraries/LiquidCrystal@^1.0.7
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	milesburton/DallasTemperature@^4.0.6
	adafruit/Adafruit BMP280 Library@^3.0.0

monitor_speed = 115200
build_flags =
	-D VERSION=\"1.0.0\"

; diag_main.cpp содержит собственные setup()/loop() и в основную прошивку
; попасть не должен.
build_src_filter = +<*> -<diag_main.cpp>

; Диагностический образ: сканирует шины и ничего не включает. Собирается
; отдельно, чтобы не тянуть диагностику в рабочую прошивку.
[env:uno_diag]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
	paulstoffregen/OneWire@^2.3.8
monitor_speed = 115200
build_src_filter = +<diag_main.cpp>
